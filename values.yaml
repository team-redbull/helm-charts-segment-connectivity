# Default values target the local kind cluster, where the Temporal server and
# the mock next service run on the host and are reached via host.docker.internal.
# For OpenShift, override config.* (e.g. via values-openshift.yaml or --set) —
# the images and templates stay the same.
#
# NOTE: the per-direction port policy (PORTS_*) deliberately does NOT live here.
# It is defined directly in templates/config.yaml — the ConfigMap is the
# operator's edit surface for ports (edit + restart activity workers, no
# rebuild, no chart re-render).
#
# The GLOBAL values (Temporal connection, DOMAIN, segmentsManagerUrl) are NOT
# here either — they live in the workflows-orchestrator chart's `workflows-orchestrator-config`,
# which this chart's activity worker also mounts. Install workflows-orchestrator first.
#
# This chart never creates or names a Namespace: it deploys into whichever
# namespace the release targets (`helm install -n <ns>`, or the release's
# `namespace:` field in redbull-platform's helmfile). On redbull-platform that
# namespace (redbull-workflows) is pre-created by its own `namespaces` release;
# standalone, pass `--create-namespace` to `helm install`.

# Site network topology — site name -> {pool, bmc}. The one exception to the
# PORTS_* rule above, and for a specific reason: unlike ports, this is SHARED
# with another chart. helm-charts-segments-manager renders the same value into
# its own ConfigMap, so redbull-platform has to be able to set it once for both.
# Ports are this chart's alone; site topology is not.
#
# This worker reads only `bmc`; `pool` is the Segments Manager's.
#
# Deliberately EMPTY, and it must stay that way. The value is defined once in
# redbull-platform (gitops/values/<env>.yaml, key `siteNetworks`), which the
# ApplicationSet merges in ahead of this file. Helm DEEP-MERGES maps: a
# non-empty default here would NOT be replaced by the environment's value, it
# would merge with it, silently leaking a stale site into every environment.
# Empty + the fail guard in templates/config.yaml is the only safe shape.
siteNetworks: {}
config:
  # The next (connectivity/firewall) service. In dev this points at
  # dev/mock-segment-connectivity running OUTSIDE the chart; in air-gapped prod, at the
  # real next service.
  nextUrl: "http://host.docker.internal:9000"
  # next URI paths are configurable because prod paths may differ from the
  # placeholders the local mock serves.
  nextTokenRenewalUri: "/token-renewal-uri"
  nextOpenRulesUri: "/open-rules-uri"
  nextCheckStatusUri: "/check-request-status"
  # The AD group next attributes every open-rules request to. A group in next's
  # own directory — this placeholder suits the local mock (which accepts any
  # string); real environments must override it via redbull-platform's values.
  nextGroup: "dev-group"
  # Seconds between polls of a submitted next request's status. 15s here for
  # immediate feedback against the local mock; prod (real human-driven
  # approval) should override to 600 (10 min) via redbull-platform's values.
  nextCheckingRequestIntervalSeconds: 15
# Bearer token for mutating Segments Manager calls (must match its API_TOKEN).
secrets:
  # RECOMMENDED for real environments: reference an out-of-band Secret holding
  # the token (key SEGMENTS_MANAGER_API_TOKEN), created once in-cluster, so the
  # value never passes through git or Helm values — same pattern as the
  # Segments Manager chart's `auth.existingSecret`. When set, this chart does
  # NOT create/own its own token Secret.
  existingSecret: ""
  # Chart-managed fallback (local/dev only): the chart creates a
  # `segments-manager-token` Secret from this value. Only consulted when
  # existingSecret is empty. Override via --set, never commit a real token.
  segmentsManagerApiToken: "dev-token"
activityWorker:
  image:
    repository: ghcr.io/team-redbull/segment-lifecycle
    tag: v0.1.8
    pullPolicy: IfNotPresent
  replicas: 2
