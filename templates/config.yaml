# segment-connectivity-config: the per-workflow ConfigMap for the segment-connectivity domain.
# Holds ONLY segment-connectivity-specific endpoints + policy. Values shared across all
# domains (Temporal, DOMAIN, SEGMENTS_MANAGER_URL) live in the global
# `workflows-orchestrator-config` owned by the workflows-orchestrator chart, which the activity
# worker also mounts. Every key equals a SegmentConnectivityActivitySettings field
# (uppercased) — keep shared/settings.py and this file aligned.
apiVersion: v1
kind: ConfigMap
metadata:
  name: segment-connectivity-config
data:
  NEXT_URL: {{ .Values.config.nextUrl | quote }}
  NEXT_TOKEN_RENEWAL_URI: {{ .Values.config.nextTokenRenewalUri | quote }}
  NEXT_OPEN_RULES_URI: {{ .Values.config.nextOpenRulesUri | quote }}
  NEXT_CHECK_STATUS_URI: {{ .Values.config.nextCheckStatusUri | quote }}
  # Seconds between polls of a submitted next request's status. Fast locally
  # (immediate feedback against the mock), slow in prod (human-driven
  # approval) — override via redbull-platform's per-environment values.
  NEXT_CHECKING_REQUEST_INTERVAL_SECONDS: {{ .Values.config.nextCheckingRequestIntervalSeconds | quote }}
  # -- Port policy per rule direction (the operator's edit surface) ----------
  # Compact JSON per protocol: {"tcp": ["PORT", "START-END", ...], "udp": [...]}.
  # The activity layer expands this into the next API's ports structure, and
  # validates the syntax at worker startup (a bad edit crash-loops the activity
  # worker instead of failing a workflow hours in). Changing ports requires
  # only a restart of the activity workers — no image rebuild.
  PORTS_HC_TO_MCE: '{"tcp": ["30000-32767"], "udp": ["9000"]}'
  PORTS_MCE_TO_HC: '{"tcp": ["6443", "30000-32767"]}'
  PORTS_INVENTORY_TO_MCE: '{"tcp": ["30000-32767"], "udp": ["9000"]}'
  PORTS_MCE_TO_INVENTORY: '{"tcp": ["6443", "30000-32767"]}'
  PORTS_PXE_TO_MCE: '{"tcp": ["30000-32767"], "udp": ["9000"]}'
  PORTS_MCE_TO_PXE: '{"tcp": ["6443", "30000-32767"]}'
  # -- Site topology: site name -> {pool, bmc} ------------------------------
  # Defined ONCE in redbull-platform (gitops/values/<env>.yaml, key
  # `siteNetworks`) and rendered from that same value into BOTH this ConfigMap
  # and the Segments Manager's. The two services being keyed by the identical
  # site list is now structural — it used to be enforced only by this comment,
  # which is why a "site-a" placeholder once matched no real site.
  #
  # This worker reads only `bmc`: every MCE segment opens a one-directional rule
  # to its site's static BMC network, which the Segments Manager does not track.
  # `pool` is the Segments Manager's (the range its segments must fall inside)
  # and is ignored here — SiteNetworks sets extra="ignore" so neither service
  # breaks when the other's sub-keys change.
  #
  # A site missing from this map fails every MCE segment in it with
  # BmcSegmentNotConfiguredError, non-retryable by design: a config gap, not an
  # outage. BMC networks sit deliberately outside every site's `pool` — BMC is a
  # separate network, not something the Segments Manager allocates from.
  #
  # `fail` rather than sprig `required`: required only rejects nil/"", so an
  # empty map would render as the string "{}" and only fail at pod startup.
{{- if not .Values.siteNetworks }}
{{- fail "siteNetworks is empty. Define it once in redbull-platform (gitops/values/<env>.yaml, key `siteNetworks`); the ApplicationSet merges that file in ahead of this chart's values." }}
{{- end }}
  SITE_NETWORKS: {{ .Values.siteNetworks | toJson | quote }}
  PORTS_MCE_TO_BMC: '{"tcp": ["623"], "udp": ["623"]}'
{{- if not .Values.secrets.existingSecret }}
---
# Bearer token for mutating Segments Manager calls. Replace for non-local envs.
# Skipped when secrets.existingSecret is set (the token then lives in an
# out-of-band Secret this chart neither creates nor owns).
apiVersion: v1
kind: Secret
metadata:
  name: segments-manager-token
type: Opaque
stringData:
  SEGMENTS_MANAGER_API_TOKEN: {{ .Values.secrets.segmentsManagerApiToken | quote }}
{{- end }}
